[project]
name = "rhythm-trainer-backend"
version = "0.1.0"
description = "节奏训练网站的 FastAPI 后端"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "alibabacloud-dypnsapi20170525",
    "alibabacloud-tea-openapi",
    "alibabacloud-tea-util",
    "fastapi",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
