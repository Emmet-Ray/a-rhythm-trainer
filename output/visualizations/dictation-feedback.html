<div id="rhythm-feedback-proposal">
  <style>
    #rhythm-feedback-proposal { --paper:light-dark(#fff,#25232d); --ink:light-dark(#343044,#eeebf6); --purple:light-dark(#7653df,#b59bff); --tint:light-dark(#f4efff,#373047); --line:light-dark(#e4deee,#51495f); --red:light-dark(#b73838,#ff9999); --green:light-dark(#267943,#87d8a0); color:var(--ink); background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:24px; font:16px/1.5 system-ui,sans-serif; }
    #rhythm-feedback-proposal .measure-nav { display:flex; align-items:center; gap:12px; margin-bottom:24px; }
    #rhythm-feedback-proposal button { font:inherit; color:var(--ink); background:transparent; border:0; border-radius:9px; padding:10px 14px; cursor:pointer; }
    #rhythm-feedback-proposal button[aria-pressed="true"] { background:var(--tint); color:var(--purple); }
    #rhythm-feedback-proposal .wrong { color:var(--red); }
    #rhythm-feedback-proposal .right { color:var(--green); }
    #rhythm-feedback-proposal .score { display:grid; grid-template-columns:1fr 1fr; }
    #rhythm-feedback-proposal .measure { min-width:0; padding:16px 12px 24px; border-bottom:3px solid transparent; }
    #rhythm-feedback-proposal .measure.selected { background:var(--tint); border-bottom-color:var(--purple); }
    #rhythm-feedback-proposal .measure-heading { display:flex; align-items:center; flex-wrap:wrap; gap:12px; font-weight:600; min-height:32px; }
    #rhythm-feedback-proposal .number { font-size:14px; font-weight:400; }
    #rhythm-feedback-proposal .staff { position:relative; height:100px; margin-top:20px; }
    #rhythm-feedback-proposal .staff::before { content:""; position:absolute; top:62px; left:0; right:-24px; border-top:1px solid var(--ink); }
    #rhythm-feedback-proposal .staff::after { content:""; position:absolute; top:40px; left:0; height:44px; border-left:1px solid var(--ink); }
    #rhythm-feedback-proposal .measure:last-child .staff::before { right:0; }
    #rhythm-feedback-proposal .notes { position:relative; display:flex; align-items:center; gap:16px; padding-left:12px; height:84px; }
    #rhythm-feedback-proposal .meter { font:bold 26px/0.9 Georgia,serif; margin-top:42px; }
    #rhythm-feedback-proposal .note { font:60px/1 Georgia,serif; margin-top:18px; }
    #rhythm-feedback-proposal .whole { display:block; width:17px; height:11px; border:3px solid var(--ink); border-left-width:5px; border-right-width:5px; border-radius:50%; margin-top:42px; }
    #rhythm-feedback-proposal .footer { margin-top:28px; padding-top:16px; border-top:1px solid var(--line); color:var(--ink); opacity:.65; }
    @media(max-width:420px) { #rhythm-feedback-proposal { padding:16px; } #rhythm-feedback-proposal .measure-heading { gap:6px; } }
  </style>
  <div class="measure-nav" role="group" aria-label="小节导航">
    <span>小节</span>
    <button type="button" data-measure="1" aria-pressed="false" aria-label="小节 1，有错误">1 <span class="wrong">×</span></button>
    <button type="button" data-measure="2" aria-pressed="true" aria-label="小节 2，正确">2 <span class="right">✓</span></button>
  </div>
  <div class="score" aria-label="反馈位置示意，当前选中第二小节">
    <div class="measure" data-panel="1">
      <div class="measure-heading"><span class="number">1</span><span class="wrong">× 有错误</span></div>
      <div class="staff" aria-label="第一小节，八分音符"><div class="notes"><span class="meter">4<br>4</span><span class="note">♪</span></div></div>
    </div>
    <div class="measure selected" data-panel="2">
      <div class="measure-heading"><span class="number">2</span><span class="right">✓ 正确</span></div>
      <div class="staff" aria-label="第二小节，全音符"><div class="notes"><span class="whole"></span></div></div>
    </div>
  </div>
  <div class="footer">音符与节奏型输入区（保持原样）</div>
  <script>
    (() => {
      const root = document.getElementById('rhythm-feedback-proposal');
      root.querySelectorAll('[data-measure]').forEach(button => {
        button.addEventListener('click', () => {
          const selected = button.dataset.measure;
          root.querySelectorAll('[data-measure]').forEach(item => item.setAttribute('aria-pressed', String(item.dataset.measure === selected)));
          root.querySelectorAll('[data-panel]').forEach(item => item.classList.toggle('selected', item.dataset.panel === selected));
          root.querySelector('.score').setAttribute('aria-label', '反馈位置示意，当前选中第' + selected + '小节');
        });
      });
    })();
  </script>
</div>
