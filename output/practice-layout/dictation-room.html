tems:center;gap:8px;font-weight:650}#dictation-room .dr-editor-title strong::before{content:"";width:3px;height:13px;background:var(--dr-purple);border-radius:2px}#dictation-room .dr-meta{color:var(--dr-muted);font-size:11px}#dictation-room .dr-sheet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-height:348px;min-height:215px;overflow:auto;align-content:start;padding:4px 3px 13px;scrollbar-width:thin}#dictation-room .dr-measure{border:1px solid var(--dr-line);border-radius:8px;min-width:0;background:var(--dr-paper);position:relative;align-self:start;cursor:pointer}#dictation-room .dr-measure.selected{border-color:var(--dr-purple);background:var(--dr-soft);box-shadow:0 0 0 1px var(--dr-purple)}#dictation-room .dr-measure.playing::after{content:"";position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--dr-purple)}#dictation-room .dr-measure-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 0;font-size:10px;color:var(--dr-muted)}#dictation-room .dr-select-measure{border:0;background:transparent;padding:0;font-size:10px;color:inherit;min-height:20px}#dictation-room .selected .dr-select-measure{color:var(--dr-purple);font-weight:650}#dictation-room .dr-notation{width:100%;height:111px;display:block;color:var(--dr-ink)}#dictation-room .dr-empty{font-size:11px;fill:var(--dr-muted)}#dictation-room .dr-note-button{cursor:pointer;outline:none}#dictation-room .dr-note-button:focus-visible .dr-note-hit{stroke:var(--dr-purple);stroke-width:2}#dictation-room .dr-note-selected{color:var(--dr-purple)}#dictation-room .dr-note-selected .dr-note-hit{fill:color-mix(in srgb,var(--dr-purple) 12%,transparent)}#dictation-room .dr-measure-foot{display:flex;justify-content:space-between;align-items:center;padding:0 12px 10px;color:var(--dr-muted);font-size:10px}#dictation-room .dr-add{border:0;background:transparent;color:var(--dr-purple);font-size:10px;padding:2px 0}#dictation-room .dr-edit-row{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--dr-line);padding:12px 0;color:var(--dr-muted);font-size:11px}#dictation-room .dr-edit-actions{display:flex;gap:5px}#dictation-room .dr-small{height:29px;border:1px solid var(--dr-line);background:var(--dr-paper);border-radius:5px;display:inline-flex;justify-content:center;align-items:center;padding:0 8px;font-size:11px}#dictation-room .dr-small svg{width:14px;height:14px}#dictation-room .dr-submit{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:5px}#dictation-room .dr-text-button{font-size:11px;border:0;background:transparent;color:var(--dr-muted);padding:8px 0;display:flex;align-items:center;gap:5px}#dictation-room .dr-text-button svg{width:13px;height:13px}#dictation-room .dr-message{font-size:11px;color:var(--dr-muted);min-height:29px;padding-top:13px;line-height:1.6}#dictation-room .dr-reference{margin-top:12px;border-top:1px solid var(--dr-line);padding-top:12px}#dictation-room .dr-reference[hidden]{display:none}#dictation-room .dr-reference strong{font-size:11px;color:var(--dr-muted);font-weight:500}#dictation-room .dr-reference svg{height:83px;max-width:340px}#dictation-room .dr-palette{padding:21px 17px;background:color-mix(in srgb,var(--dr-bg) 55%,var(--dr-paper));border-left:1px solid var(--dr-line)}#dictation-room .dr-palette-head{display:flex;align-items:center;justify-content:space-between;gap:5px;font-size:12px;margin-bottom:14px}#dictation-room .dr-palette-head span{font-size:10px;color:var(--dr-muted)}#dictation-room .dr-label{font-size:10px;color:var(--dr-muted);margin:0 0 7px}#dictation-room .dr-symbols{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:15px}#dictation-room .dr-symbol{border:1px solid var(--dr-line);background:var(--dr-paper);border-radius:6px;height:56px;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:3px;color:var(--dr-purple);gap:1px}#dictation-room .dr-symbol svg{width:33px;height:29px;overflow:visible}#dictation-room .dr-symbol span{font-size:9px;color:var(--dr-muted)}#dictation-room .dr-symbol:active{background:var(--dr-soft)}#dictation-room .dr-extra{display:flex;gap:7px}#dictation-room .dr-extra button{flex:1}#dictation-room .dr-palette-note{font-size:10px;color:var(--dr-muted);line-height:1.8;margin:13px 0 0}#dictation-room .dr-end{font-size:11px;color:var(--dr-muted);margin-top:14px;display:flex;justify-content:space-between;gap:10px}#dictation-room[data-tools=bottom] .dr-layout{grid-template-columns:1fr}#dictation-room[data-tools=bottom] .dr-palette{border-left:0;border-top:1px solid var(--dr-line);display:grid;grid-template-columns:1fr 1fr;gap:0 20px}#dictation-room[data-tools=bottom] .dr-palette-head{grid-column:1/-1}#dictation-room[data-tools=bottom] .dr-symbols{grid-template-columns:repeat(5,1fr)}#dictation-room[data-tools=bottom] .dr-palette-note{margin:4px 0 0}#dictation-room[data-tools=bottom] .dr-sheet{min-height:180px}
@media(max-width:760px){#dictation-room .dr-transport{gap:12px}#dictation-room .dr-play-actions{flex:1}#dictation-room .dr-speed{margin-left:auto}#dictation-room .dr-layout{grid-template-columns:minmax(0,1fr) 185px}#dictation-room .dr-palette{padding:20px 12px}#dictation-room .dr-editor{padding:20px 16px}#dictation-room .dr-scope{order:3}#dictation-room .dr-symbol{height:52px}}
@media(max-width:580px){#dictation-room .dr-top{height:56px;padding:0 19px}#dictation-room .dr-brand{font-size:18px}#dictation-room .dr-nav{gap:17px}#dictation-room .dr-nav span:first-child,#dictation-room .dr-nav span:last-child{display:none}#dictation-room .dr-body{padding:18px 16px 20px}#dictation-room h1{font-size:25px}#dictation-room .dr-heading{margin-bottom:18px}#dictation-room .dr-heading p{font-size:11px}#dictation-room .dr-mode{display:none}#dictation-room .dr-crumb{font-size:11px;margin-bottom:14px}#dictation-room .dr-transport{padding:13px;gap:10px}#dictation-room .dr-play-actions{width:100%;flex:auto}#dictation-room .dr-play-actions button{flex:1;padding:0 9px}#dictation-room .dr-speed{order:3}#dictation-room .dr-scope{order:2}#dictation-room .dr-layout{grid-template-columns:1fr}#dictation-room .dr-sheet{grid-template-columns:1fr;min-height:173px;max-height:190px;gap:10px}#dictation-room .dr-palette,#dictation-room[data-tools=bottom] .dr-palette{border-left:0;border-top:1px solid var(--dr-line);padding:17px 15px;display:block}#dictation-room .dr-symbols,#dictation-room[data-tools=bottom] .dr-symbols{grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}#dictation-room .dr-symbol{height:51px}#dictation-room .dr-palette-head{margin-bottom:10px}#dictation-room .dr-palette-note{margin-top:9px}#dictation-room .dr-end span:last-child{display:none}#dictation-room .dr-edit-row{flex-wrap:wrap}#dictation-room .dr-editor{padding:17px 14px 15px}#dictation-room .dr-measure-head{padding:7px 7px 0;font-size:9px}#dictation-room .dr-measure-foot{padding:0 7px 7px;font-size:9px}#dictation-room .dr-notation{height:95px}#dictation-room .dr-measure-head>span{display:none}}
@media(prefers-reduced-motion:reduce){#dictation-room *{transition:none!important}}

<div id="dictation-room" data-tools="side" aria-label="节奏听写页面设计">
 <header class="dr-top"><div class="dr-brand"><span class="dr-mark" aria-hidden="true"><b></b><b></b><b></b><b></b></span>节奏训练</div><nav class="dr-nav" aria-label="主导航"><span>首页</span><span class="active" aria-current="page">练习</span><span>设置</span><span>登录</span></nav></header>
 <main class="dr-body"><div class="dr-crumb"><i data-lucide="arrow-left" aria-hidden="true"></i><span>预设练习</span><span>/</span><span>基础时值</span></div><div class="dr-heading"><div><h1>节奏听写 · 练习 1</h1><p>听出时值，再把节奏写下来。</p></div><div class="dr-mode"><i data-lucide="headphones" aria-hidden="true"></i>节奏听写</div></div>
 <section class="dr-work" aria-label="听写工作区">
  <div class="dr-transport"><div class="dr-play-actions"><button class="dr-button dr-primary" id="dr-question"><i data-lucide="play" aria-hidden="true"></i><span>播放题目</span></button><button class="dr-button" id="dr-draft"><i data-lucide="headphones" aria-hidden="true"></i><span>播放我的答案</span></button></div><div class="dr-scope" role="group" aria-label="播放范围"><button id="dr-all" aria-pressed="true">整题</button><button id="dr-current" aria-pressed="false">当前小节</button></div><div class="dr-speed"><button class="dr-metro" id="dr-metro" aria-label="关闭节拍器" aria-pressed="true"><svg viewBox="0 0 60 76" aria-hidden="true"><path d="M20 4 H40 L54 71 H6 Z" fill="var(--dr-soft)" stroke="currentColor" stroke-width="2"/><path d="M20 26 H40 M17 41 H43 M14 56 H46" stroke="var(--dr-line)" stroke-width="2"/><g id="dr-arm"><path d="M30 64 V12" stroke="currentColor" stroke-width="2"/><rect x="26" y="26" width="8" height="11" rx="2" fill="currentColor"/></g><circle cx="30" cy="64" r="3" fill="currentColor"/></svg></button><input id="dr-bpm" type="number" min="40" max="240" value="60" aria-label="速度 BPM"><span>BPM</span></div></div>
  <div class="dr-layout"><section class="dr-editor" aria-label="我的答案编辑区"><div class="dr-editor-title"><strong>我的答案</strong><span class="dr-meta" id="dr-meta">4/4 拍 · 2 小节</span></div><div class="dr-sheet" id="dr-sheet"></div><div class="dr-edit-row"><span id="dr-position">第 1 小节 · 在末尾添加</span><div class="dr-edit-actions"><button class="dr-small" id="dr-undo" aria-label="撤销" disabled><i data-lucide="undo-2" aria-hidden="true"></i></button><button class="dr-small" id="dr-delete">删除末尾</button><button class="dr-small" id="dr-clear">清空小节</button></div></div><div class="dr-submit"><button class="dr-button dr-primary" id="dr-check"><i data-lucide="check" aria-hidden="true"></i><span>验证当前小节</span></button><button class="dr-text-button" id="dr-answer" aria-expanded="false"><i data-lucide="eye" aria-hidden="true"></i><span>查看答案</span></button></div><div class="dr-message" id="dr-message" role="status">选择音符，补全当前小节。</div><div class="dr-reference" id="dr-reference" hidden></div></section>
   <aside class="dr-palette" aria-label="音符工具"><div class="dr-palette-head"><strong>写入节奏</strong><span id="dr-remaining">还差 2 拍</span></div><div><p class="dr-label">音符</p><div class="dr-symbols" id="dr-notes"></div></div><div><p class="dr-label">休止符</p><div class="dr-symbols" id="dr-rests"></div></div><div class="dr-extra"><button class="dr-small" id="dr-dot">· 附点</button><button class="dr-small" id="dr-triplet">三连音</button></div><p class="dr-palette-note">点选谱面音符可替换<br>点击“继续添加”在末尾写入</p></aside>
  </div>
 </section><div class="dr-end"><span id="dr-play-status">先听一遍题目，再逐小节填写。</span><span>播放前有 4 拍预备拍</span></div></main>
</div>
<script>
(()=>{
 const root=document.getElementById('dictation-room'),$=s=>root.querySelector(s);
 const state={tools:'side',length:'2',bpm:60,enabled:true,scope:'all',measure:0,index:null};
 const note=(d,rest=false)=>({d,rest});
 const patterns=[[note(1),note(1),note(2)],[note(.5),note(.5),note(1),note(2)],[note(2),note(2)],[note(1),note(1),note(1),note(1)]];
 let drafts=[[note(1),note(1)],[]],history=[],showAnswer=false,ctx=null,run=null,frame=null,generation=0;
 const durations=[4,2,1,.5,.25],names=['全音符','二分音符','四分音符','八分音符','十六分音符'];
 const sum=items=>items.reduce((a,n)=>a+n.d,0),near=(a,b)=>Math.abs(a-b)<.0001;
 const fmt=n=>Number(n.toFixed(2)).toString();
 function glyph(n,x=15,y=27,scale=1){
  let shape='';
  if(n.rest){if(n.d>=2)shape='<path d="M7 14 H26" stroke="currentColor"/><rect x="11" y="'+(n.d===4?14:9)+'" width="12" height="5" fill="currentColor"/>';
   else if(n.d===1)shape='<path d="M17 3 L22 10 L15 16 L22 23 Q10 20 15 30" fill="none" stroke="currentColor" stroke-width="3"/>';
   else shape='<path d="M24 10 L17 29 M23 11 Q18 17 13 12" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="11" r="3" fill="currentColor"/>'+(n.d===.25?'<path d="M21 18 Q16 24 11 20" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="19" r="3" fill="currentColor"/>':'');
  }else{const base=n.dot?n.d/1.5:n.d;shape='<ellipse cx="13" cy="26" rx="5.3" ry="3.5" transform="rotate(-22 13 26)" fill="'+(base>=2?'var(--dr-paper)':'currentColor')+'" stroke="currentColor" stroke-width="1.5"/>';
   if(base<4)shape+='<path d="M18 25 V3" stroke="currentColor" stroke-width="1.5"/>';
   if(base<1&&!n.triplet)shape+='<path d="M18 3 Q30 13 24 20 Q27 11 18 10" fill="currentColor"/>';
   if(base===.25)shape+='<path d="M18 9 Q30 19 24 26 Q27 17 18 16" fill="currentColor"/>';
   if(n.dot)shape+='<circle cx="24" cy="25" r="1.8" fill="currentColor"/>';
   if(n.triplet)shape+='<text x="24" y="7" font-size="9" fill="currentColor">3</text>';
  }
  return '<g transform="translate('+(x-13*scale)+' '+(y-26*scale)+') scale('+scale+')">'+shape+'</g>';
 }
 function notation(items,m,reference=false){
  let s='<svg class="dr-notation" viewBox="0 0 260 120" role="img" aria-label="第 '+(m+1)+' 小节'+(reference?'参考答案':'已写 '+fmt(sum(items))+' 拍')+'"><path d="M15 77 H247 M15 53 V95 M247 53 V95" fill="none" stroke="currentColor" stroke-width="1"/>';
  if(!items.length)s+='<text x="130" y="54" text-anchor="middle" class="dr-empty">点击填写这一小节</text>';
  let pos=0;items.forEach((n,i)=>{const x=36+pos*48;s+='<g '+(reference?'':'role="button" tabindex="0" aria-label="第 '+(m+1)+' 小节第 '+(i+1)+' 个'+(n.rest?'休止符':'音符')+'，'+fmt(n.d)+' 拍" data-note="'+i+'" data-measure="'+m+'"')+' class="dr-note-button '+(!reference&&m===state.measure&&i===state.index?'dr-note-selected':'')+'"><rect class="dr-note-hit" x="'+(x-10)+'" y="30" width="'+Math.max(17,n.d*48-2)+'" height="62" rx="4" fill="transparent"/>'+glyph(n,x,77,1.35)+'</g>';pos+=n.d;});
  return s+'</svg>';
 }
 function render(){
  const count=Number(state.length);while(drafts.length<count)drafts.push([]);if(drafts.length>count)drafts.length=count;state.measure=Math.min(state.measure,count-1);
  root.dataset.tools=state.tools;$('#dr-meta').textContent='4/4 拍 · '+count+' 小节';
  $('#dr-sheet').innerHTML=drafts.map((items,m)=>'<div class="dr-measure '+(m===state.measure?'selected':'')+'" data-bar="'+m+'"><div class="dr-measure-head"><button class="dr-select-measure" data-select="'+m+'" aria-pressed="'+(m===state.measure)+'">第 '+(m+1)+' 小节</button><span>'+(m===state.measure?'正在编辑':'')+'</span></div>'+notation(items,m)+'<div class="dr-measure-foot"><span>'+fmt(sum(items))+' / 4 拍</span><button class="dr-add" data-append="'+m+'">'+(near(sum(items),4)?'已填满':'继续添加')+'</button></div></div>').join('');
  const items=drafts[state.measure],used=sum(items);$('#dr-remaining').textContent=near(used,4)?'已满 4 拍':'还差 '+fmt(4-used)+' 拍';
  $('#dr-position').textContent='第 '+(state.measure+1)+' 小节 · '+(state.index===null?'在末尾添加':'替换第 '+(state.index+1)+' 个符号');
  $('#dr-delete').textContent=state.index===null?'删除末尾':'删除选中';$('#dr-delete').disabled=items.length===0;$('#dr-clear').disabled=items.length===0;$('#dr-dot').disabled=items.length===0;$('#dr-undo').disabled=history.length===0;
  $('#dr-draft').disabled=!(state.scope==='all'?drafts.some(a=>a.length):items.length);
  root.querySelectorAll('[data-duration]').forEach(b=>{const next=Number(b.dataset.duration),old=state.index===null?0:items[state.index]?.d||0;b.disabled=used-old+next>4.0001;});
  $('#dr-answer').setAttribute('aria-expanded',String(showAnswer));$('#dr-answer span').textContent=showAnswer?'收起答案':'查看答案';$('#dr-reference').hidden=!showAnswer;
  if(showAnswer)$('#dr-reference').innerHTML='<strong>第 '+(state.measure+1)+' 小节 · 参考答案</strong>'+notation(patterns[state.measure%4],state.measure,true);
 }
 function message(text){$('#dr-message').textContent=text;}
 function remember(){history.push(JSON.stringify({drafts,measure:state.measure}));if(history.length>30)history.shift();}
 function edit(entries){const items=drafts[state.measure],copy=items.slice();if(state.index===null)copy.push(...entries);else copy.splice(state.index,1,...entries);if(sum(copy)>4.0001){message('这一小节放不下，请选择更短的时值。');return;}stop();remember();drafts[state.measure]=copy;state.index=null;showAnswer=false;render();message(near(sum(copy),4)?'当前小节已填满，可以回放或验证。':'已写入 · 还差 '+fmt(4-sum(copy))+' 拍');}
 durations.forEach((d,i)=>{for(const rest of [false,true]){const b=document.createElement('button');b.className='dr-symbol';b.dataset.duration=d;b.setAttribute('aria-label',rest?names[i].replace('音符','休止符'):names[i]);b.innerHTML='<svg viewBox="0 0 36 34" aria-hidden="true">'+glyph(note(d,rest))+'</svg><span>'+fmt(d)+' 拍</span>';b.onclick=()=>edit([note(d,rest)]);$(rest?'#dr-rests':'#dr-notes').append(b);}});
 $('#dr-sheet').onclick=e=>{const target=e.target.closest('[data-note]'),append=e.target.closest('[data-append]'),bar=e.target.closest('[data-bar]');if(!bar)return;state.measure=Number(bar.dataset.bar);state.index=target?Number(target.dataset.note):null;showAnswer=false;if(append)state.index=null;render();message(state.index===null?'选择音符，在当前小节末尾添加。':'已选中，点击工具中的符号可替换。');};
 $('#dr-sheet').onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-note]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}};
 $('#dr-delete').onclick=()=>{stop();remember();drafts[state.measure].splice(state.index??drafts[state.measure].length-1,1);state.index=null;showAnswer=false;render();message('已删除，可撤销。');};
 $('#dr-clear').onclick=()=>{stop();remember();drafts[state.measure]=[];state.index=null;showAnswer=false;render();message('已清空当前小节，可撤销。');};
 $('#dr-undo').onclick=()=>{if(!history.length)return;stop();const prev=JSON.parse(history.pop());drafts=prev.drafts;state.measure=prev.measure;state.index=null;showAnswer=false;render();message('已撤销上一步。');};
 $('#dr-dot').onclick=()=>{const items=drafts[state.measure],i=state.index??items.length-1;if(i<0)return;const n=items[i];if(n.triplet){message('三连音暂不添加附点。');return;}state.index=i;edit([{...n,d:n.dot?n.d/1.5:n.d*1.5,dot:!n.dot}]);};
 $('#dr-triplet').onclick=()=>edit([0,1,2].map(()=>({...note(1/3),triplet:true})));
 $('#dr-check').onclick=()=>{const items=drafts[state.measure],target=patterns[state.measure%4];if(!near(sum(items),4)){message('还差 '+fmt(4-sum(items))+' 拍，先补全这一小节。');return;}const correct=items.length===target.length&&items.every((n,i)=>near(n.d,target[i].d)&&n.rest===target[i].rest);message(correct?'这一小节正确！可以继续下一小节。':'时值已满，但节奏还不一样。试着只播放当前小节，再听一次。');};
 $('#dr-answer').onclick=()=>{showAnswer=!showAnswer;render();};
 function scope(next){stop();state.scope=next;$('#dr-all').setAttribute('aria-pressed',String(next==='all'));$('#dr-current').setAttribute('aria-pressed',String(next==='current'));render();}
 $('#dr-all').onclick=()=>scope('all');$('#dr-current').onclick=()=>scope('current');
 function stop(){generation++;if(frame!==null)cancelAnimationFrame(frame);frame=null;if(run)run.nodes.forEach(n=>{try{n.stop();}catch{}});run=null;$('#dr-arm').removeAttribute('transform');$('#dr-question span').textContent='播放题目';$('#dr-draft span').textContent='播放我的答案';root.querySelectorAll('.playing').forEach(n=>n.classList.remove('playing'));$('#dr-play-status').textContent='先听一遍题目，再逐小节填写。';}
 function tone(time,freq,duration,volume){const osc=ctx.createOscillator(),gain=ctx.createGain();osc.frequency.value=freq;gain.gain.setValueAtTime(0,time);gain.gain.linearRampToValueAtTime(volume,time+.003);gain.gain.exponentialRampToValueAtTime(.001,time+duration);osc.connect(gain).connect(ctx.destination);osc.start(time);osc.stop(time+duration+.01);run.nodes.push(osc);osc.onended=()=>{osc.disconnect();gain.disconnect();};}
 async function play(kind){if(run?.kind===kind){stop();return;}stop();const ticket=generation;try{ctx??=new AudioContext();await ctx.resume();if(ticket!==generation)return;const measures=state.scope==='all'?drafts.map((_,i)=>i):[state.measure];run={kind,measures,start:ctx.currentTime+.12,beat:60/state.bpm,next:0,nodes:[],last:-2};const source=kind==='question'?measures.map(i=>patterns[i%4]):measures.map(i=>drafts[i].map(n=>({...n})));
  source.forEach((items,m)=>{let offset=4+m*4;items.forEach(n=>{if(!n.rest)tone(run.start+offset*run.beat,440,Math.min(n.d*run.beat*.8,.24),.09);offset+=n.d;});});$(kind==='question'?'#dr-question span':'#dr-draft span').textContent='停止播放';animate();
 }catch{stop();$('#dr-play-status').textContent='暂时无法播放声音，请重试。';}}
 function animate(){if(!run)return;const now=ctx.currentTime,progress=(now-run.start)/run.beat,total=4+run.measures.length*4;while(run.next<total&&run.start+run.next*run.beat<now+.08){const n=run.next++;if(n<4||state.enabled)tone(run.start+n*run.beat,n%4?720:1000,.045,.045);}if(progress>=total){stop();$('#dr-play-status').textContent='播放结束';return;}const beat=Math.floor(progress);if(beat!==run.last){run.last=beat;$('#dr-play-status').textContent=beat<0?'准备中':beat<4?'预备拍 '+(beat+1)+' / 4':(run.kind==='question'?'正在播放题目':'正在播放我的答案')+' · 第 '+(run.measures[Math.floor((beat-4)/4)]+1)+' 小节';root.querySelectorAll('[data-bar]').forEach(el=>el.classList.toggle('playing',beat>=4&&Number(el.dataset.bar)===run.measures[Math.floor((beat-4)/4)]));}$('#dr-arm').setAttribute('transform','rotate('+(state.enabled&&progress>=0&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches?-25*Math.cos(Math.PI*progress):0)+' 30 64)');frame=requestAnimationFrame(animate);}
 $('#dr-question').onclick=()=>play('question');$('#dr-draft').onclick=()=>play('draft');
 $('#dr-metro').onclick=()=>{state.enabled=!state.enabled;$('#dr-metro').setAttribute('aria-pressed',String(state.enabled));$('#dr-metro').setAttribute('aria-label',state.enabled?'关闭节拍器':'开启节拍器');$('#dr-metro').style.opacity=state.enabled?'1':'.35';};
 $('#dr-bpm').oninput=e=>{const n=Number(e.target.value);if(Number.isInteger(n)&&n>=40&&n<=240){if(n!==state.bpm)stop();state.bpm=n;}};$('#dr-bpm').onchange=()=>{$('#dr-bpm').value=state.bpm;};
 window.addEventListener('pagehide',()=>{stop();if(ctx)void ctx.close();});
 render();
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{stop();state.index=null;history=[];showAnswer=false;render();}});tweak.addSelect(state,'length',{label:'题目长度',options:[{label:'2 小节',value:'2'},{label:'4 小节',value:'4'},{label:'8 小节',value:'8'}]});tweak.addSelect(state,'tools',{label:'音符工具位置',options:[{label:'右侧 · 推荐',value:'side'},{label:'下方',value:'bottom'}]});}
})();
</script>
